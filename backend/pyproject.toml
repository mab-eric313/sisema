[project]
name = "sisema"
version = "0.1.0"
description = "SISEMA — Sistem Informasi Senat Mahasiswa UISI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "emails>=1.1.3",
    "fastapi[standard]>=0.162.0",
    "psycopg[binary]>=3.3.8",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "pyjwt>=2.15.1",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "mypy>=1.8.0,<3.0.0",
    "pytest>=9.2.0",
    "ruff>=0.16.0,<1.0.0",
]

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py314"
exclude = ["alembic"]
